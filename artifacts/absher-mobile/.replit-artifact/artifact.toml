kind = "mobile"
previewPath = "/absher-mobile/"
title = "أبشر أعمال - موبايل"
version = "1.0.0"
id = "artifacts/absher-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/absher-mobile/" ]
localPort = 24834

[services.development]
run = "pnpm --filter @workspace/absher-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/absher-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/absher-mobile", "run", "serve" ]

[services.env]
PORT = "24834"
BASE_PATH = "/absher-mobile/"
