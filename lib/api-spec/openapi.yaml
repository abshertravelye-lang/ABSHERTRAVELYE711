openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Absher Travel & Tourism API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: offers
    description: Travel offers
  - name: destinations
    description: Tourist destinations
  - name: bookings
    description: Booking management
  - name: visas
    description: Visa information
  - name: visa-countries
    description: Visa destination countries
  - name: visa-custom-fields
    description: Visa custom application form fields
  - name: programs
    description: Tourist programs
  - name: contact
    description: Contact messages
  - name: dashboard
    description: Admin dashboard stats
  - name: auth
    description: Authentication and user management
  - name: flights
    description: Flight search and comparison
  - name: notifications
    description: Customer notification center
  - name: employees
    description: Admin/staff account management
  - name: visa-applications
    description: Visa application submissions
  - name: umrah-applications
    description: Umrah visa application service (independent workflow)
  - name: application-documents
    description: Per-application document management & additional-document requests
  - name: visa-required-documents
    description: Per-visa dynamic required-document configuration
  - name: storage
    description: File upload and object storage
  - name: support-chat
    description: In-app support chat (customer, guest, and staff)
  - name: agencies
    description: Admin management of travel agencies, agent accounts, visa services & pricing
  - name: agent-portal
    description: B2B agent portal (agent-scoped dashboard, visa services, applications)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /offers:
    get:
      operationId: listOffers
      tags: [offers]
      summary: List all offers
      parameters:
        - name: featured
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Offer"
    post:
      operationId: createOffer
      tags: [offers]
      summary: Create an offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"

  /offers/admin/list:
    get:
      operationId: listOffersAdmin
      tags: [offers]
      summary: List all offers (admin, includes inactive)
      responses:
        "200":
          description: List of all offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Offer"

  /offers/{id}:
    get:
      operationId: getOffer
      tags: [offers]
      summary: Get an offer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Offer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
    patch:
      operationId: updateOffer
      tags: [offers]
      summary: Update an offer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferUpdate"
      responses:
        "200":
          description: Updated offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
    delete:
      operationId: deleteOffer
      tags: [offers]
      summary: Delete an offer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /destinations:
    get:
      operationId: listDestinations
      tags: [destinations]
      summary: List all destinations
      responses:
        "200":
          description: List of destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Destination"
    post:
      operationId: createDestination
      tags: [destinations]
      summary: Create a destination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"

  /destinations/{id}:
    get:
      operationId: getDestination
      tags: [destinations]
      summary: Get a destination
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Destination details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
    patch:
      operationId: updateDestination
      tags: [destinations]
      summary: Update a destination
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
    delete:
      operationId: deleteDestination
      tags: [destinations]
      summary: Delete a destination
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /programs:
    get:
      operationId: listPrograms
      tags: [programs]
      summary: List tourist programs
      parameters:
        - name: featured
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
    post:
      operationId: createProgram
      tags: [programs]
      summary: Create a program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"

  /programs/{id}:
    get:
      operationId: getProgram
      tags: [programs]
      summary: Get a program
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Program details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
    patch:
      operationId: updateProgram
      tags: [programs]
      summary: Update a program
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
    delete:
      operationId: deleteProgram
      tags: [programs]
      summary: Delete a program
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /visa-countries:
    get:
      operationId: listVisaCountries
      tags: [visa-countries]
      summary: List visa destination countries
      parameters:
        - name: region
          in: query
          schema:
            type: string
            enum: [gulf, arab, asian, european, african, american]
        - name: activeOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of countries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisaCountry"
    post:
      operationId: createVisaCountry
      tags: [visa-countries]
      summary: Create a visa country
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisaCountryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisaCountry"

  /visa-countries/{id}:
    get:
      operationId: getVisaCountry
      tags: [visa-countries]
      summary: Get a visa country with its visa count
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Country details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisaCountry"
    patch:
      operationId: updateVisaCountry
      tags: [visa-countries]
      summary: Update a visa country
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisaCountryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisaCountry"
    delete:
      operationId: deleteVisaCountry
      tags: [visa-countries]
      summary: Delete a visa country
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /visa-countries/{id}/visas:
    get:
      operationId: listVisasByCountry
      tags: [visa-countries]
      summary: List visa types for a specific country
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of visas for this country
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Visa"

  /visas:
    get:
      operationId: listVisas
      tags: [visas]
      summary: List visa information by country
      parameters:
        - name: countryId
          in: query
          schema:
            type: integer
        - name: region
          in: query
          schema:
            type: string
            enum: [gulf, arab, asian, european, african, american]
      responses:
        "200":
          description: List of visa entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Visa"
    post:
      operationId: createVisa
      tags: [visas]
      summary: Create visa entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visa"

  /visas/{id}:
    get:
      operationId: getVisa
      tags: [visas]
      summary: Get visa details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Visa details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visa"
    patch:
      operationId: updateVisa
      tags: [visas]
      summary: Update visa entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisaUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visa"
    delete:
      operationId: deleteVisa
      tags: [visas]
      summary: Delete visa entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /visas/{id}/custom-fields:
    get:
      operationId: listVisaCustomFields
      tags: [visa-custom-fields]
      summary: List custom fields for a visa type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of custom fields
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisaCustomField"
    post:
      operationId: createVisaCustomField
      tags: [visa-custom-fields]
      summary: Add a custom field to a visa type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisaCustomFieldInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisaCustomField"

  /visa-custom-fields/{id}:
    patch:
      operationId: updateVisaCustomField
      tags: [visa-custom-fields]
      summary: Update a custom field
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisaCustomFieldUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisaCustomField"
    delete:
      operationId: deleteVisaCustomField
      tags: [visa-custom-fields]
      summary: Delete a custom field
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /visa-applications/track/{trackingNumber}:
    get:
      operationId: trackVisaApplication
      tags: [visa-applications]
      summary: Track a visa application by tracking number (public)
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Application tracking info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisaApplicationTracking"
        "404":
          description: Not found

  /visa-applications/ocr:
    post:
      operationId: ocrPassport
      tags: [visa-applications]
      summary: Extract passport data from an uploaded image using OCR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageUrl]
              properties:
                imageUrl:
                  type: string
                  description: Object storage URL of the passport image
      responses:
        "200":
          description: Extracted passport data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcrResult"

  /visa-applications:
    get:
      operationId: listVisaApplications
      tags: [visa-applications]
      summary: List visa applications (admin)
      parameters:
        - name: visaId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [received, under_review, awaiting_documents, documents_uploaded, sent_to_embassy, processing, issued, completed, rejected]
      responses:
        "200":
          description: List of visa applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisaApplication"
    post:
      operationId: createVisaApplication
      tags: [visa-applications]
      summary: Submit a new visa application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisaApplicationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisaApplication"
        "422":
          description: Applicant is not eligible for this visa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /visa-applications/{id}:
    get:
      operationId: getVisaApplication
      tags: [visa-applications]
      summary: Get a visa application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Visa application details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisaApplication"
    patch:
      operationId: updateVisaApplication
      tags: [visa-applications]
      summary: Update a visa application status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisaApplicationStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisaApplication"

  /umrah/config:
    get:
      operationId: getUmrahConfig
      tags: [umrah-applications]
      summary: Get Umrah declaration text and fee for a nationality
      parameters:
        - name: nationality
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Umrah config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UmrahConfig"

  /umrah-applications:
    get:
      operationId: listUmrahApplications
      tags: [umrah-applications]
      summary: List the caller's own Umrah applications
      responses:
        "200":
          description: List of Umrah applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UmrahApplication"
    post:
      operationId: createUmrahApplication
      tags: [umrah-applications]
      summary: Submit a new Umrah visa application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UmrahApplicationCreate"
      responses:
        "201":
          description: Created (awaiting payment)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UmrahApplicationCreated"
        "409":
          description: Duplicate active application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error (e.g. no sponsor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /umrah-applications/{id}/pay:
    post:
      operationId: payUmrahApplication
      tags: [umrah-applications]
      summary: Pay for an Umrah application (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Paid and submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UmrahApplication"
        "409":
          description: Application cannot be paid for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /umrah-applications/admin/list:
    get:
      operationId: listUmrahApplicationsAdmin
      tags: [umrah-applications]
      summary: List all Umrah applications with user info (admin)
      responses:
        "200":
          description: List of Umrah applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UmrahApplicationAdmin"

  /umrah-applications/{id}:
    get:
      operationId: getUmrahApplication
      tags: [umrah-applications]
      summary: Get an Umrah application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Umrah application details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UmrahApplication"
    patch:
      operationId: updateUmrahApplication
      tags: [umrah-applications]
      summary: Update an Umrah application status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UmrahApplicationStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UmrahApplication"

  /visa-applications/{id}/documents:
    get:
      operationId: listApplicationDocuments
      tags: [application-documents]
      summary: List documents (with version history) for an application
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationDocument"
        "403":
          description: Forbidden
        "404":
          description: Application not found

  /visa-applications/{id}/documents/request:
    post:
      operationId: requestApplicationDocument
      tags: [application-documents]
      summary: Request an additional document from the customer (staff)
      description: Idempotent on (applicationId, documentKey) — a double-click or retry updates the existing slot instead of creating a duplicate.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestApplicationDocumentInput"
      responses:
        "201":
          description: New document request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocument"
        "200":
          description: Existing document request updated (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocument"

  /visa-applications/{id}/documents/{docId}/upload:
    post:
      operationId: uploadApplicationDocument
      tags: [application-documents]
      summary: Upload (or re-upload) a version of a requested document (customer)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadApplicationDocumentInput"
      responses:
        "201":
          description: New version uploaded, document under review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocument"
        "400":
          description: Invalid file type / size / storage object
        "403":
          description: Forbidden

  /visa-applications/{id}/documents/{docId}/approve:
    post:
      operationId: approveApplicationDocument
      tags: [application-documents]
      summary: Approve an uploaded document (staff)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocument"

  /visa-applications/{id}/documents/{docId}/reject:
    post:
      operationId: rejectApplicationDocument
      tags: [application-documents]
      summary: Reject an uploaded document with a required reason (staff)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectApplicationDocumentInput"
      responses:
        "200":
          description: Document rejected, re-upload required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocument"
        "400":
          description: rejectionReason missing

  /visas/{id}/required-documents:
    get:
      operationId: listVisaRequiredDocuments
      tags: [visa-required-documents]
      summary: List the required-document config for a visa
      security:
        - bearerAuth: []
      parameters:
