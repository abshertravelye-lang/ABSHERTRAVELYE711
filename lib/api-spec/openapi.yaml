        updatedAt: { type: string }
        whatsapp: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        profilePhotoUrl: { type: ["string", "null"] }
        passportNumber: { type: ["string", "null"] }
        passportIssueCountry: { type: ["string", "null"] }
        passportIssuePlace: { type: ["string", "null"] }
        passportIssueDate: { type: ["string", "null"] }
        passportExpiryDate: { type: ["string", "null"] }
        passportImageUrl: { type: ["string", "null"] }
        isGccResident: { type: boolean }
        gccResidenceCountry: { type: ["string", "null"] }
        gccResidenceNumber: { type: ["string", "null"] }
        gccResidenceExpiry: { type: ["string", "null"] }
        gccResidenceFrontUrl: { type: ["string", "null"] }
        gccResidenceBackUrl: { type: ["string", "null"] }
        isEuropeanResident: { type: boolean }
        europeanDocumentType: { type: ["string", "null"] }
