            type: object
            required: [visaId, enabled, agentPrice]
            properties:
              visaId: { type: integer }
              enabled: { type: boolean }
              agentPrice:
                oneOf:
                  - { type: number }
                  - { type: string }
              currency: { type: string }

    AgentVisaService:
      type: object
      required: [visaId, agentPrice]
      properties:
