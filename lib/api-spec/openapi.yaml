      summary: Staff reply (notifies linked customer)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportMessageInput"
      responses:
        "201":
          description: Reply created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessage"
        "404":
          description: Conversation not found

  /support/admin/conversations/{id}:
    patch:
      operationId: updateAdminSupportConversation
      tags: [support-chat]
      summary: Update conversation status (open/close)
      security:
        - bearerAuth: []
