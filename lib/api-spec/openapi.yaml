        countryCode: { type: string, nullable: true }
        visaType: { type: string }
        category: { type: string }
        descriptionAr: { type: string, nullable: true }
        descriptionEn: { type: string, nullable: true }
        processingDays: { type: integer }
        stayDuration: { type: integer, nullable: true }
        validityDays: { type: integer, nullable: true }
        entryType: { type: string }
        allowedNationalities:
          type: array
          items: { type: string }
        blockedNationalities:
          type: array
          items: { type: string }
        imageUrl: { type: string, nullable: true }
        requiresPassportImage: { type: boolean }
        requiresPersonalPhoto: { type: boolean }

    AgentApplication:
      type: object
      required: [id, trackingNumber, visaId, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        trackingNumber: { type: string, nullable: true }
        visaId: { type: integer }
        agencyId: { type: integer, nullable: true }
        submittedByAgentId: { type: string, nullable: true }
        agentPrice: { type: string, nullable: true }
        fullName: { type: string }
        fullNameEn: { type: string, nullable: true }
        nationality: { type: string }
        gender: { type: string }
        dateOfBirth: { type: string }
        email: { type: string }
        phone: { type: string }
        passportNumber: { type: string }
        passportIssueDate: { type: string, nullable: true }
        passportExpiryDate: { type: string }
        passportIssuingCountry: { type: string, nullable: true }
        countryOfResidence: { type: string, nullable: true }
        passportImageUrl: { type: string, nullable: true }
        personalPhotoUrl: { type: string, nullable: true }
        residencyImageUrl: { type: string, nullable: true }
        residencyBackImageUrl: { type: string, nullable: true }
        visaImageUrl: { type: string, nullable: true }
        customFieldResponses: { type: object, additionalProperties: true }
        agreedToTerms: { type: boolean }
        status: { type: string }
        adminNotes: { type: string, nullable: true }
        issuedVisaUrl: { type: string, nullable: true }
        agencyName: { type: string, nullable: true }
        agentName: { type: string, nullable: true }
        visaType: { type: string, nullable: true }
        countryEn: { type: string, nullable: true }
        countryAr: { type: string, nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }

    AgentApplicationInput:
      type: object
      required: [visaId, applicantNationality, fullName, gender, dateOfBirth, email, phone, passportNumber, passportIssueDate, passportExpiryDate]
      properties:
        visaId: { type: integer }
        applicantNationality: { type: string }
        fullName: { type: string }
        fullNameEn: { type: string }
        gender: { type: string, enum: [male, female] }
        dateOfBirth: { type: string }
        email: { type: string }
        phone: { type: string }
        passportNumber: { type: string }
        passportIssueDate: { type: string }
        passportExpiryDate: { type: string }
        passportIssuingCountry: { type: string }
        countryOfResidence: { type: string }
        passportImageUrl: { type: string }
        personalPhotoUrl: { type: string }
        residencyImageUrl: { type: string }
        residencyBackImageUrl: { type: string }
        visaImageUrl: { type: string }
        customFieldResponses: { type: object, additionalProperties: true }
        agreedToTerms: { type: boolean }

    AgentApplicationUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [received, under_review, awaiting_documents, documents_uploaded, sent_to_embassy, processing, issued, completed, rejected, cancelled]
        adminNotes: { type: string }
        issuedVisaUrl: { type: string }

    AgentMe:
      type: object
      required: [agent, agency]
      properties:
        agent:
          type: object
          properties:
            id: { type: string }
            email: { type: string, nullable: true }
            phone: { type: string, nullable: true }
            firstName: { type: string, nullable: true }
            lastName: { type: string, nullable: true }
        agency:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            status: { type: string, enum: [active, suspended, pending] }
            contactEmail: { type: string, nullable: true }
            contactPhone: { type: string, nullable: true }

    AgentDashboard:
      type: object
      required: [agencyName, agencyStatus, stats]
      properties:
        agencyName: { type: string }
        agencyStatus: { type: string, enum: [active, suspended, pending] }
        stats:
          type: object
          properties:
            total: { type: integer }
            submitted: { type: integer }
            approved: { type: integer }
            rejected: { type: integer }
            inProgress: { type: integer }
            byStatus: { type: object, additionalProperties: { type: integer } }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
