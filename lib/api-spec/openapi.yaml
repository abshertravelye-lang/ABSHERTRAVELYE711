  # ── SUPPORT CHAT ───────────────────────────────────────────────────────────

  /support/conversation:
    post:
      operationId: getOrCreateSupportConversation
      tags: [support-chat]
      summary: Get-or-create the caller's single open support conversation
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Existing open conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportConversation"
        "201":
          description: New conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportConversation"

  /support/messages:
    get:
      operationId: listSupportMessages
      tags: [support-chat]
      summary: List messages of the caller's conversation (resets customer unread)
      security:
        - bearerAuth: []
      parameters:
        - name: after
          in: query
          description: ISO timestamp or message id; returns messages created after it
          schema:
            type: string
      responses:
        "200":
          description: Messages (oldest to newest)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportMessage"
    post:
      operationId: sendSupportMessage
      tags: [support-chat]
      summary: Send a customer message (creates conversation if none)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportMessageInput"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessage"

  /support/guest/conversation:
    post:
      operationId: createGuestSupportConversation
      tags: [support-chat]
      summary: Create a guest support conversation (no auth)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestConversationInput"
      responses:
        "201":
          description: Guest conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestConversationResponse"

  /support/guest/messages:
    get:
      operationId: listGuestSupportMessages
      tags: [support-chat]
      summary: List messages for a guest conversation by token (no auth)
      description: >-
        Provide the guest token via the `x-guest-token` header (preferred).
        The `token` query param is still accepted for backward compatibility
        but is deprecated. Only works while the conversation is unclaimed;
        once claimed by an account the token is revoked (404).
      security: []
      parameters:
        - name: x-guest-token
          in: header
          required: false
          description: Guest conversation token (preferred over the query param).
          schema:
            type: string
        - name: token
          in: query
          required: false
          deprecated: true
          description: Deprecated — use the x-guest-token header instead.
          schema:
            type: string
        - name: after
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Messages (oldest to newest)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportMessage"
        "404":
          description: Conversation not found
    post:
      operationId: sendGuestSupportMessage
      tags: [support-chat]
      summary: Send a guest message by token (no auth)
      description: >-
        Provide the guest token via the `x-guest-token` header (preferred);
        the `token` body field is deprecated but still accepted. Only works
        while the conversation is unclaimed.
      security: []
      parameters:
        - name: x-guest-token
          in: header
          required: false
          description: Guest conversation token (preferred over the body field).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestMessageInput"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessage"
        "404":
          description: Conversation not found
        "429":
          description: Rate limited

  /support/guest/claim:
    post:
      operationId: claimGuestSupportConversation
      tags: [support-chat]
      summary: Link a guest conversation to the calling account
      description: >-
        Atomic, one-time claim. Provide the guest token via the
        `x-guest-token` header (preferred) or the deprecated `token` body
        field. On success the guest token is revoked so it can never be
        replayed. Returns 409 if the token is unknown or the conversation was
        already claimed (by this or another account).
      security:
        - bearerAuth: []
      parameters:
        - name: x-guest-token
          in: header
          required: false
          description: Guest conversation token (preferred over the body field).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimGuestConversationInput"
      responses:
        "200":
          description: Conversation linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportConversation"
        "400":
          description: Missing guest token
        "409":
          description: Token invalid or conversation already claimed

  /support/admin/conversations:
    get:
      operationId: listAdminSupportConversations
      tags: [support-chat]
      summary: List all support conversations (staff)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Conversations (newest activity first)
          content:
