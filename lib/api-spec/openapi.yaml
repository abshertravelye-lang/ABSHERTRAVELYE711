        createdAt: { type: string }
        lastLoginAt: { type: string, nullable: true }

    AgentAccountInput:
      type: object
      required: [password, firstName]
      properties:
        email: { type: string }
        phone: { type: string }
        password: { type: string, minLength: 8 }
        firstName: { type: string }
        lastName: { type: string }

    AgentAccountUpdate:
      type: object
      properties:
        isActive: { type: boolean }
        firstName: { type: string }
        lastName: { type: string }

    ResetPasswordInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8 }

    AgencyVisaService:
      type: object
      required: [id, agencyId, visaId, enabled, agentPrice, currency, createdAt, updatedAt]
      properties:
        id: { type: integer }
        agencyId: { type: integer }
        visaId: { type: integer }
        enabled: { type: boolean }
        agentPrice: { type: string }
        currency: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }

    AgencyVisaServicesInput:
      type: object
      required: [services]
