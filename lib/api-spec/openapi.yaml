  # ── FLIGHT SCHEMAS ───────────────────────────────────────────────────────

    FlightSegment:
      type: object
      required: [legOrder, segmentOrder, flightNumber, airlineIata, airlineName, originIata, destinationIata, departureAt, arrivalAt, durationMin, cabinClass]
      properties:
        legOrder: { type: integer }
        segmentOrder: { type: integer }
        flightNumber: { type: string }
        airlineIata: { type: string }
        airlineName: { type: string }
        airlineLogoUrl: { type: ["string", "null"] }
        operatingAirlineIata: { type: ["string", "null"] }
        originIata: { type: string }
        originCity: { type: string }
        destinationIata: { type: string }
        destinationCity: { type: string }
        departureAt: { type: string }
        arrivalAt: { type: string }
        durationMin: { type: integer }
        aircraftType: { type: ["string", "null"] }
        cabinClass: { type: string }

    FlightOffer:
      type: object
      required: [providerSlug, providerOfferId, totalPrice, baseFare, taxes, currency, stops, totalDurationMin, isRefundable, baggageIncludedKg, carryOnIncluded, segments]
      properties:
        providerSlug: { type: string }
        providerOfferId: { type: string }
        totalPrice: { type: number }
        baseFare: { type: number }
        taxes: { type: number }
        currency: { type: string }
        stops: { type: integer }
        totalDurationMin: { type: integer }
        isRefundable: { type: boolean }
        baggageIncludedKg: { type: integer }
        carryOnIncluded: { type: boolean }
        deeplinkUrl: { type: ["string", "null"] }
        segments:
          type: array
          items:
            $ref: "#/components/schemas/FlightSegment"

    ProviderSummary:
      type: object
      required: [provider, count, lowestPrice, currency]
      properties:
        provider: { type: string }
        count: { type: integer }
        lowestPrice: { type: number }
        currency: { type: string }

    FlightSearchResults:
      type: object
      required: [searchHash, totalResults, providerSummary, offers]
      properties:
        searchHash: { type: string }
        cachedAt: { type: ["string", "null"] }
        totalResults: { type: integer }
        providerSummary:
          type: array
          items:
            $ref: "#/components/schemas/ProviderSummary"
        offers:
          type: array
          items:
            $ref: "#/components/schemas/FlightOffer"

    ProviderStatus:
      type: object
      required: [slug, name, supportsBooking, isAvailable]
      properties:
        slug: { type: string }
        name: { type: string }
        supportsBooking: { type: boolean }
        isAvailable: { type: boolean }

    # ── Agencies / Agent Portal ──────────────────────────────────────────────
    Agency:
      type: object
      required: [id, name, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        contactEmail: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        status: { type: string, enum: [active, suspended, pending] }
        createdAt: { type: string }
        updatedAt: { type: string }

    AgencyInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        contactEmail: { type: string }
        contactPhone: { type: string }
        address: { type: string }
        notes: { type: string }
        status: { type: string, enum: [active, suspended, pending] }

    AgencyUpdate:
      type: object
      properties:
        name: { type: string }
        contactEmail: { type: string }
        contactPhone: { type: string }
        address: { type: string }
        notes: { type: string }
        status: { type: string, enum: [active, suspended, pending] }

    AgentAccount:
      type: object
      required: [id, role, isActive, createdAt]
      properties:
        id: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        role: { type: string }
        agencyId: { type: integer, nullable: true }
